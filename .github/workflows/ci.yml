name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: node -c server.js

      - name: Run unit tests
        run: npm test

      - name: Verify tool schemas
        run: node scripts/ci-verify-tool-schemas.js

      - name: Verify package.json files
        run: npm pack --dry-run

      - name: Lint package
        run: node scripts/ci-lint-package.js
