<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单自动填充测试页面</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f0f2f5;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 40px;
    }
    h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #333;
      margin-bottom: 6px;
      font-weight: 500;
    }
    label .required {
      color: #f5222d;
      margin-left: 4px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="number"],
    input[type="url"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24,144,255,0.2);
    }
    textarea {
      min-height: 80px;
      resize: vertical;
    }
    .radio-group, .checkbox-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .radio-group label, .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      margin-bottom: 0;
      cursor: pointer;
    }
    .form-row {
      display: flex;
      gap: 16px;
    }
    .form-row .form-group {
      flex: 1;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #1890ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #40a9ff;
    }
    .submit-btn:active {
      background: #096dd9;
    }
    .result-message {
      display: none;
      padding: 16px;
      border-radius: 6px;
      margin-top: 20px;
      text-align: center;
    }
    .result-message.success {
      display: block;
      background: #f6ffed;
      color: #52c41a;
      border: 1px solid #b7eb8f;
    }
    .result-message.error {
      display: block;
      background: #fff2f0;
      color: #f5222d;
      border: 1px solid #ffccc7;
    }
    .disabled-field {
      background: #f5f5f5;
      color: #999;
      cursor: not-allowed;
    }
    .tip {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>用户注册表单</h1>
    <p class="subtitle">用于测试 browser_form_fill 自动填充功能</p>

    <form id="registerForm" onsubmit="handleSubmit(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="username">用户名<span class="required">*</span></label>
          <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label for="realname">真实姓名</label>
          <input type="text" id="realname" name="realname" placeholder="请输入真实姓名">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">邮箱<span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="请输入邮箱地址" required>
        </div>
        <div class="form-group">
          <label for="phone">手机号码<span class="required">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="请输入11位手机号" required pattern="[0-9]{11}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">密码<span class="required">*</span></label>
          <input type="password" id="password" name="password" placeholder="请输入密码" required minlength="6">
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认密码<span class="required">*</span></label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="age">年龄</label>
          <input type="number" id="age" name="age" placeholder="请输入年龄" min="1" max="120">
        </div>
        <div class="form-group">
          <label for="birthday">出生日期</label>
          <input type="date" id="birthday" name="birthday">
        </div>
      </div>

      <div class="form-group">
        <label for="website">个人网站</label>
        <input type="url" id="website" name="website" placeholder="https://example.com">
      </div>

      <div class="form-group">
        <label for="city">所在城市</label>
        <select id="city" name="city">
          <option value="">请选择城市</option>
          <option value="beijing">北京</option>
          <option value="shanghai">上海</option>
          <option value="guangzhou">广州</option>
          <option value="shenzhen">深圳</option>
          <option value="hangzhou">杭州</option>
        </select>
      </div>

      <div class="form-group">
        <label>性别</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="male"> 男</label>
          <label><input type="radio" name="gender" value="female"> 女</label>
          <label><input type="radio" name="gender" value="other"> 其他</label>
        </div>
      </div>

      <div class="form-group">
        <label>兴趣爱好</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="hobby" value="reading"> 阅读</label>
          <label><input type="checkbox" name="hobby" value="music"> 音乐</label>
          <label><input type="checkbox" name="hobby" value="sports"> 运动</label>
          <label><input type="checkbox" name="hobby" value="coding"> 编程</label>
        </div>
      </div>

      <div class="form-group">
        <label for="address">详细地址</label>
        <textarea id="address" name="address" placeholder="请输入详细地址"></textarea>
      </div>

      <div class="form-group">
        <label for="idcard">身份证号</label>
        <input type="text" id="idcard" name="idcard" placeholder="请输入18位身份证号">
        <div class="tip">仅用于表单填充测试，不会上传任何数据</div>
      </div>

      <div class="form-group">
        <label for="inviteCode">邀请码</label>
        <input type="text" id="inviteCode" name="inviteCode" class="disabled-field" value="AUTO-2024" disabled>
        <div class="tip">此字段为禁用状态，自动填充时应跳过</div>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" name="agree" required>
          我已阅读并同意用户协议和隐私政策
        </label>
      </div>

      <button type="submit" class="submit-btn">立即注册</button>

      <div id="resultMessage" class="result-message"></div>
    </form>
  </div>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => {
        if (data[key]) {
          if (Array.isArray(data[key])) {
            data[key].push(value);
          } else {
            data[key] = [data[key], value];
          }
        } else {
          data[key] = value;
        }
      });

      const resultEl = document.getElementById('resultMessage');

      if (!data.username || !data.email || !data.phone || !data.password) {
        resultEl.className = 'result-message error';
        resultEl.textContent = '注册失败：请填写所有必填字段';
        return;
      }

      if (data.password !== data.confirmPassword) {
        resultEl.className = 'result-message error';
        resultEl.textContent = '注册失败：两次密码输入不一致';
        return;
      }

      if (!data.agree) {
        resultEl.className = 'result-message error';
        resultEl.textContent = '注册失败：请同意用户协议';
        return;
      }

      resultEl.className = 'result-message success';
      resultEl.textContent = `注册成功！欢迎您，${data.username || '用户'}！`;
      console.log('Form submitted:', data);
    }
  </script>
</body>
</html>
