<!DOCTYPE html>
<html>
<head>
  <title>Captcha Comprehensive Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; max-width: 1200px; margin: 0 auto; }
    .captcha-group { display: inline-block; margin: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .captcha-group h3 { margin-top: 0; color: #333; }
    .captcha-img { border: 1px solid #ccc; padding: 5px; margin: 10px 0; }
    .result { font-weight: bold; color: #007bff; }
    .expected { color: #666; font-size: 0.9em; }
    input { padding: 8px; margin: 5px; width: 150px; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>验证码综合测试页面</h1>
  <p>包含多种类型的验证码图片，用于测试 OCR 识别能力</p>

  <div class="captcha-group">
    <h3>数字验证码 (1234)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/000/fff&text=1234" alt="1234" data-expected="1234">
    <p class="expected">期望: 1234</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>字母数字混合 (A1B2)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/000/fff&text=A1B2" alt="A1B2" data-expected="A1B2">
    <p class="expected">期望: A1B2</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>纯字母大写 (ABCD)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/000/fff&text=ABCD" alt="ABCD" data-expected="ABCD">
    <p class="expected">期望: ABCD</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>纯字母小写 (abcd)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/000/fff&text=abcd" alt="abcd" data-expected="abcd">
    <p class="expected">期望: abcd</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>6位数字 (123456)</h3>
    <img class="captcha-img" src="http://dummyimage.com/140x50/000/fff&text=123456" alt="123456" data-expected="123456">
    <p class="expected">期望: 123456</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>字母数字混合 (XY99)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/fff/000&text=XY99" alt="XY99" data-expected="XY99">
    <p class="expected">期望: XY99</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>随机验证码 (Qw23)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/eee/333&text=Qw23" alt="Qw23" data-expected="Qw23">
    <p class="expected">期望: Qw23</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <div class="captcha-group">
    <h3>复杂组合 (a7Xk)</h3>
    <img class="captcha-img" src="http://dummyimage.com/120x50/333/fff&text=a7Xk" alt="a7Xk" data-expected="a7Xk">
    <p class="expected">期望: a7Xk</p>
    <input type="text" placeholder="输入验证码">
    <button>提交</button>
  </div>

  <script>
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function() {
        const group = this.parentElement;
        const input = group.querySelector('input');
        const expected = group.querySelector('img').dataset.expected;
        const result = group.querySelector('.result');
        
        if (input.value.toLowerCase() === expected.toLowerCase()) {
          input.style.borderColor = '#28a745';
          if (!result) {
            const span = document.createElement('span');
            span.className = 'result';
            span.textContent = '✓ 正确!';
            group.appendChild(span);
          }
        } else {
          input.style.borderColor = '#dc3545';
        }
      });
    });
  </script>
</body>
</html>
